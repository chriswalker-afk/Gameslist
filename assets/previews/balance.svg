  <path d="M-12-25 H12 L17-3 Q17 0 13 0 H-13 Q-17 0-17-3Z" fill="url(#metal)" stroke="#90663d" stroke-width="1.8"/>
  <path d="M-9-20 H9" stroke="#fff0c2" stroke-width="2" stroke-linecap="round"/>
  <text x="0" y="-7" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#60472f">1</text>
 </g>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
<ellipse cx="320" cy="160" rx="310" ry="190" fill="url(#glow)"/>
