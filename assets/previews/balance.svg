<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">How much does the sprite weigh? illustrated preview</title>
<desc id="desc">Two white sprites and two gold weights balance six gold weights on a level scale.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#173e49"/><stop offset="1" stop-color="#10252f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#68cbb0" stop-opacity=".4"/><stop offset="1" stop-color="#68cbb0" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#efdfbc"/><stop offset="1" stop-color="#aa8654"/></linearGradient>
 <linearGradient id="body" x2="0" y2="1"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#d4e5de"/></linearGradient>
 <g id="sprite">
  <ellipse cx="0" cy="3" rx="27" ry="5" fill="#142832" opacity=".36"/>
  <path d="M-21-7 Q-34-26-24-45 Q-16-63-4-58 Q4-70 14-56 Q32-48 28-28 Q29-9 16-4 L15 0 Q7 6 2-2 Q-7 6-13 0 L-15-5Z" fill="url(#body)" stroke="#8ba8a3" stroke-width="2.5"/>
  <ellipse cx="-9" cy="-32" rx="3.8" ry="6" fill="#18323a"/><ellipse cx="10" cy="-32" rx="3.8" ry="6" fill="#18323a"/>
  <path d="M-5-20 Q0-15 5-20" fill="none" stroke="#18323a" stroke-width="2" stroke-linecap="round"/>
 </g>
