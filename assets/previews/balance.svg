<rect x="202" y="41" width="236" height="49" rx="24" fill="#0c222d" stroke="#69bca8" stroke-opacity=".65"/>
<text x="320" y="74" font-family="sans-serif" font-weight="700" font-size="25" text-anchor="middle" fill="#f2e7c9">2x + 2 = 6</text>
